<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledger{% endblock %} · q3 accounting</title>
  <style>
    :root {
      --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
      --ok:#15803d; --bad:#b91c1c; --bg:#fafafa;
    }
    * { box-sizing: border-box; }
    body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: var(--ink); background: var(--bg); margin: 0; }
    header { background:#fff; border-bottom:1px solid var(--line); padding: 14px 24px;
             display:flex; align-items:baseline; gap:24px; }
    header .brand { font-weight: 700; }
    nav a { margin-right: 16px; color: var(--accent); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 760px; margin: 28px auto; padding: 0 24px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.lede { color: var(--muted); margin: 0 0 22px; }
    table { border-collapse: collapse; width: 100%; background:#fff; border:1px solid var(--line); }
    th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums;
                     font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
    tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; }
    .ok  { color: var(--ok); font-weight: 600; }
    .bad { color: var(--bad); font-weight: 600; }
    .muted { color: var(--muted); }
    form label { display:block; margin: 14px 0 4px; font-weight:600; }
    input[type=text], input[type=number], input[type=password] {
      padding: 8px 10px; border:1px solid var(--line); border-radius:6px; width: 300px; font-size:15px; }
    button, .btn { background: var(--accent); color:#fff; border:0; padding: 9px 16px;
      border-radius:6px; font-size:15px; cursor:pointer; text-decoration:none; display:inline-block;
      margin-top: 16px; }
    .btn-secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn-danger { background:#fff; color:var(--bad); border:1px solid #fecaca; }
    .error { color:var(--bad); background:#fef2f2; border:1px solid #fecaca;
             padding:10px 12px; border-radius:6px; margin: 12px 0; }
    .status-Posted    { color: var(--ok); font-weight:600; }
    .status-Cancelled { color: var(--muted); }
    .status-Amended   { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <span class="brand">q3 · accounting</span>
    <nav>
      {% block nav %}
      {% if session.user %}
      <a href="{{ url_for('trial_balance') }}">Trial Balance</a>
      <a href="{{ url_for('invoices') }}">Invoices</a>
      <a href="{{ url_for('new_invoice') }}">New Invoice</a>
      {% endif %}
      {% endblock %}
    </nav>
    {% if session.user %}
    <span class="muted" style="margin-left:auto;">
      logged in as {{ session.user }}
      <form method="post" action="{{ url_for('logout') }}" style="display:inline;">
        <button type="submit" class="btn btn-secondary" style="margin:0; padding:4px 10px;">Logout</button>
      </form>
    </span>
    {% endif %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
